name: Build macOS arm64

# Builds Apple Silicon plugins against the supported-version manifest.
#
# IMPORTANT: the plugin must be built against a binary-compatible Qt and Python
# for the target ParaView series. The manifest records those ABIs explicitly.
# Qt 6 comes from aqtinstall; Qt 5 arm64 comes from Kitware's checksum-pinned
# package used for ParaView builds.
#
# Python major.minor must match because the plugin compiles against its C API
# and is loaded into ParaView's embedded interpreter.

on:
  pull_request:
    paths:
      - .github/INSTALL_PLUGIN.md
      - .github/paraview-versions.json
      - .github/workflows/paraview-versions.yml
      - scripts/paraview_versions.py
      - .github/workflows/build-macos.yml
      - CMakeLists.txt
      - CMake/**
      - LICENSE
      - LICENSES/**
      - Plugins/**
      - Testing/Smoke/**
      - THIRD-PARTY-NOTICES.txt
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        description: Version used in archive names; defaults to CMakeLists.txt
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    uses: ./.github/workflows/paraview-versions.yml

  build-plugin-macos:
    name: macOS arm64 / ParaView ${{ matrix.paraview_version }}
    needs: versions
    runs-on: macos-14
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.versions.outputs.macos) }}
    env:
      PACKAGE_VERSION: ${{ inputs.package_version }}
      PARAVIEW_VERSION: ${{ matrix.paraview_version }}
      PARAVIEW_COMMIT: ${{ matrix.paraview_commit }}
      PARAVIEW_SERIES: ${{ matrix.paraview_series }}
      QT_VERSION: ${{ matrix.qt_version }}
      RUNTIME_URL: ${{ matrix.runtime_url }}
      RUNTIME_MD5: ${{ matrix.runtime_md5 }}
      AQTINSTALL_VERSION: 3.3.0
      # Python bundled by the matching official ParaView .app. Only major.minor
      # must match; setup-python resolves the latest patch in that series.
      PYTHON_VERSION: ${{ matrix.python_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }} (matching ParaView)
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: brew install cmake ninja

      # --- Qt version matching the target ParaView binary ---------------------
      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/Qt
          key: qt-${{ env.QT_VERSION }}-macos-clang64-aqt${{ env.AQTINSTALL_VERSION }}-v2

      - name: Install Qt ${{ env.QT_VERSION }} via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true' && startsWith(env.QT_VERSION, '6.')
        run: |
          python3 -m venv /tmp/aqtenv
          /tmp/aqtenv/bin/pip install --quiet "aqtinstall==${AQTINSTALL_VERSION}"
          /tmp/aqtenv/bin/aqt install-qt mac desktop "${QT_VERSION}" clang_64 \
            -m qt5compat qtimageformats --outputdir /tmp/Qt
          ls -d "/tmp/Qt/${QT_VERSION}/macos"

      - name: Install Qt ${{ env.QT_VERSION }} for ParaView 5.13 arm64
        if: steps.cache-qt.outputs.cache-hit != 'true' && startsWith(env.QT_VERSION, '5.')
        run: |
          archive=/tmp/qt-arm64.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 --output "$archive" \
            "https://gitlab.kitware.com/api/v4/projects/6955/packages/generic/qt/v5.15.2-20210519.0/qt-5.15.2-macosx11.0-arm64.tar.xz"
          echo "e80d2647de461370bb65db60bc657148d196348b7393a2975d4a54bfba1b217f  $archive" | shasum -a 256 -c -
          mkdir -p /tmp/Qt
          tar -xf "$archive" -C /tmp/Qt
          test -d /tmp/Qt/qt-5.15.2-macosx11.0-arm64

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/Qt
          key: qt-${{ env.QT_VERSION }}-macos-clang64-aqt${{ env.AQTINSTALL_VERSION }}-v2

      # --- ParaView SDK, built against the matching Qt and Python ABI ----------
      # Restore-only so a half-built SDK from a failed run is never cached.
      - name: Restore ParaView SDK cache
        id: cache-paraview
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/paraview-sdk
          key: paraview-${{ env.PARAVIEW_COMMIT }}-macos-arm64-qt${{ env.QT_VERSION }}-py${{ env.PYTHON_VERSION }}-v2

      - name: Build ParaView SDK
        if: steps.cache-paraview.outputs.cache-hit != 'true'
        run: |
          if [[ "$QT_VERSION" == 5.* ]]; then
            QT_PREFIX="/tmp/Qt/qt-5.15.2-macosx11.0-arm64"
          else
            QT_PREFIX="/tmp/Qt/${QT_VERSION}/macos"
          fi
          for attempt in 1 2 3; do
            rm -rf /tmp/paraview-src
            if git clone --recursive --branch "v${PARAVIEW_VERSION}" --depth 1 \
              https://gitlab.kitware.com/paraview/paraview.git /tmp/paraview-src; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test "$(git -C /tmp/paraview-src rev-parse HEAD)" = "${PARAVIEW_COMMIT}"
          # Idempotent Qt6 .arg(enum) cast normalizer. This is a no-op when the
          # source already contains the required casts.
          cd /tmp/paraview-src
          for f in \
            "Qt/Core/pqFlatTreeViewEventTranslator.cxx" \
            "Qt/Core/pqQVTKWidgetEventTranslator.cxx" \
            "ThirdParty/QtTesting/vtkqttesting/pqAbstractItemViewEventTranslator.cxx" \
            "ThirdParty/QtTesting/vtkqttesting/pqBasicWidgetEventTranslator.cxx"; do
            if [ -f "$f" ]; then
              perl -0777 -pi -e '
                s/\.arg\(mouseEvent->button\(\)\)/.arg(static_cast<int>(mouseEvent->button()))/g;
                s/\.arg\(mouseEvent->buttons\(\)\)/.arg(static_cast<int>(mouseEvent->buttons()))/g;
                s/\.arg\(mouseEvent->modifiers\(\)\)/.arg(static_cast<int>(mouseEvent->modifiers()))/g;
              ' "$f"
              echo "normalized: $f"
            fi
          done
          cmake \
            -S /tmp/paraview-src \
            -B /tmp/paraview-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/paraview-sdk \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DPARAVIEW_BUILD_QT_GUI=ON \
            -DPARAVIEW_USE_QT=ON \
            -DPARAVIEW_ENABLE_PYTHON=ON \
            -DPARAVIEW_USE_PYTHON=ON \
            -DPARAVIEW_USE_MPI=OFF \
            -DPARAVIEW_ENABLE_WEB=OFF \
            -DPARAVIEW_ENABLE_EXAMPLES=OFF \
            -DVTK_WRAP_PYTHON=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build /tmp/paraview-build --parallel "$(sysctl -n hw.ncpu)"
          cmake --install /tmp/paraview-build

      - name: Save ParaView SDK cache
        if: steps.cache-paraview.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/paraview-sdk
          key: paraview-${{ env.PARAVIEW_COMMIT }}-macos-arm64-qt${{ env.QT_VERSION }}-py${{ env.PYTHON_VERSION }}-v2

      # --- Plugin, built against the same Qt ABI ------------------------------
      - name: Configure plugin
        run: |
          if [[ "$QT_VERSION" == 5.* ]]; then
            QT_PREFIX="/tmp/Qt/qt-5.15.2-macosx11.0-arm64"
          else
            QT_PREFIX="/tmp/Qt/${QT_VERSION}/macos"
          fi
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="/tmp/paraview-sdk;$QT_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DBUILD_TESTING=ON

      - name: Build plugin
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test plugin
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error -E PythonIntegration

      - name: Install plugin
        run: cmake --install build

      # The plugin links Qt by absolute path (aqt's /tmp/Qt/...). Loaded into the
      # official ParaView .app — which bundles its OWN Qt — those paths don't
      # exist on the user's machine. Rewrite Qt directly to Contents/Frameworks;
      # an external plugin cannot rely on ParaView's framework rpath being in its
      # own Mach-O load-command chain. Official ParaView macOS apps package Python
      # as Contents/Libraries/libpythonX.Y.dylib. Use @executable_path for both so
      # they resolve from the ParaView executable regardless of where the external
      # plugin is stored. Re-sign afterwards because install_name_tool invalidates
      # the signature and arm64 refuses to load an unsigned dylib.
      - name: Relink Qt + Python to ParaView's bundled copies
        run: |
          SO=$(find install -name ParaViewMCP.so -print -quit)
          test -n "$SO"
          otool -L "$SO" | awk \
            'NR > 1 && $1 ~ /Qt[A-Za-z0-9]+[.]framework/ && index($1, "/Versions/") {print $1}' | while read -r old; do
            fw=$(basename "$old")
            framework_version=$(sed -E 's#^.*/Versions/([^/]+)/.*#\1#' <<< "$old")
            new="@executable_path/../Frameworks/${fw}.framework/Versions/${framework_version}/${fw}"
            install_name_tool -change "$old" "$new" "$SO"
            echo "relinked: $old -> $new"
          done
          PY_REF="@executable_path/../Libraries/libpython${PYTHON_VERSION}.dylib"
          otool -L "$SO" | awk -v ref="$PY_REF" \
            'NR > 1 && ($1 ~ /Python\.framework|libpython3/) && $1 != ref {print $1}' | while read -r old; do
            install_name_tool -change "$old" "$PY_REF" "$SO"
            echo "relinked python: $old -> $PY_REF"
          done
          # Repeated install-name edits can leave an existing embedded signature
          # structurally stale. Remove it before applying one fresh ad-hoc signature.
          codesign --remove-signature "$SO" 2>/dev/null || true
          codesign --force --sign - "$SO"
          codesign --verify --strict --verbose=2 "$SO"
          bad_qt=$(otool -L "$SO" | awk \
            'NR > 1 && $1 ~ /Qt[A-Za-z0-9]+\.framework/ && $1 !~ /^@executable_path\/\.\.\/Frameworks\// {print $1}' | wc -l | tr -d ' ')
          echo "unexpected Qt refs: $bad_qt"
          test "$bad_qt" -eq 0
          bad_py=$(otool -L "$SO" | awk -v ref="$PY_REF" \
            'NR > 1 && ($1 ~ /Python\.framework|libpython3/) && $1 != ref {print $1}' | wc -l | tr -d ' ')
          echo "unexpected Python refs: $bad_py"
          test "$bad_py" -eq 0
          echo "=== Python refs (must be $PY_REF, or none if resolved dynamically) ==="
          otool -L "$SO" | grep -i python || echo "(none)"
          echo "=== Qt refs (must resolve from ParaView.app/Contents/Frameworks) ==="
          otool -L "$SO" | grep -E 'Qt[A-Za-z0-9]+\.framework' || echo "(none)"
          echo "=== qt_version_tag required by the plugin ==="
          nm -u "$SO" | grep -i qt_version_tag || true

      - name: Package tarball
        run: |
          version="${PACKAGE_VERSION#v}"
          if [ -z "$version" ]; then
            version=$(sed -nE \
              's/^project\(ParaViewMCP VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              CMakeLists.txt)
          fi
          test -n "$version"

          ARCHIVE_DIR="ParaViewMCP-${version}-ParaView-${PARAVIEW_VERSION#v}-macos-arm64"
          mkdir -p "${ARCHIVE_DIR}"
          SO=$(find install -name ParaViewMCP.so -print -quit)
          XML=$(find install -name ParaViewMCP.plugins.xml -print -quit)
          test -n "$SO"
          cp "$SO" "${ARCHIVE_DIR}/"
          test -z "$XML" || cp "$XML" "${ARCHIVE_DIR}/"
          cp LICENSE "${ARCHIVE_DIR}/"
          cp THIRD-PARTY-NOTICES.txt "${ARCHIVE_DIR}/"
          cp -r LICENSES "${ARCHIVE_DIR}/"
          cp .github/INSTALL_PLUGIN.md "${ARCHIVE_DIR}/INSTALL.md"
          tar czf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          shasum -a 256 "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_DIR}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=${ARCHIVE_DIR}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Load packaged plugin with official ParaView
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          runtime_dmg="$RUNNER_TEMP/paraview-runtime.dmg"
          mount_dir="$RUNNER_TEMP/paraview-volume"
          plugin_root="$(mktemp -d)"

          curl --fail --location --retry 3 --retry-all-errors \
            --output "$runtime_dmg" \
            "$RUNTIME_URL"
          actual_md5="$(md5 -q "$runtime_dmg")"
          test "$actual_md5" = "$RUNTIME_MD5"
          shasum -a 256 "$runtime_dmg"

          mkdir -p "$mount_dir"
          # Official ParaView DMGs embed an interactive redistribution license.
          # Accept it explicitly so the non-interactive Actions runner can mount
          # the already checksum-verified image.
          printf 'Y\n' | hdiutil attach -nobrowse -readonly \
            -mountpoint "$mount_dir" "$runtime_dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT

          tar -xzf "$ARCHIVE_NAME" -C "$plugin_root"
          runtime_app="$(find "$mount_dir" -maxdepth 3 -name 'ParaView*.app' -print -quit)"
          pvpython="$runtime_app/Contents/bin/pvpython"
          plugin="$(find "$plugin_root" -name ParaViewMCP.so -print -quit)"
          test -x "$pvpython"
          test -f "$plugin"
          env -u DYLD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH \
            "$pvpython" Testing/Smoke/load_plugin.py "$plugin" \
            --paraview-version "$PARAVIEW_VERSION" --python-version "$PYTHON_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-macos-arm64-pv${{ matrix.paraview_series }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.CHECKSUM_NAME }}
          if-no-files-found: error
          retention-days: 7
