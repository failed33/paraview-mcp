name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit==4.5.1
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_file=$(mktemp)
          printf '%s\n' "$PR_TITLE" > "$title_file"
          pre-commit run commitlint --hook-stage commit-msg \
            --commit-msg-filename "$title_file"
      - run: pre-commit run --all-files

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Wrapping/Python/MCPServer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check src/
      - run: uv run pytest
      - name: Check license compatibility
        run: uv run licensecheck -r pyproject.toml --ignore-packages caio --zero
      - name: Verify third-party notices are current
        continue-on-error: true
        run: uv run --project Wrapping/Python/MCPServer python scripts/update-notices.py --check
        working-directory: .

  cpp:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}-ci:6.0.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure
        run: cmake --preset dev -DParaView_DIR=/opt/paraview/lib/cmake/paraview-6.0
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset default
        env:
          QT_QPA_PLATFORM: offscreen
