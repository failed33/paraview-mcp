name: Docker CI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/docker/Dockerfile"
      - ".github/paraview-versions.json"
      - ".github/workflows/paraview-versions.yml"
      - "scripts/paraview_versions.py"

permissions:
  packages: write
  contents: read

jobs:
  versions:
    uses: ./.github/workflows/paraview-versions.yml

  build-and-push:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker
          push: true
          build-args: |
            PARAVIEW_VERSION=v${{ needs.versions.outputs.ci_version }}
            PARAVIEW_SERIES=${{ needs.versions.outputs.ci_series }}
            PARAVIEW_COMMIT=${{ needs.versions.outputs.ci_commit }}
          tags: |
            ghcr.io/${{ github.repository }}-ci:${{ needs.versions.outputs.ci_version }}
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache,mode=max
