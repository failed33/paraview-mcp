name: Docker CI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/docker/Dockerfile"

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:6.0.1
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache,mode=max
