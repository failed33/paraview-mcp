name: Docker CI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/docker/Dockerfile"

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ci:6.0.1
            ghcr.io/${{ github.repository }}-ci:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-ci:buildcache,mode=max
