name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify release versions are aligned
        run: python scripts/check-versions.py
      - name: Verify Python lockfile is current
        run: uv lock --project Wrapping/Python/MCPServer --check

  release-please:
    needs: verify-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Build package
        run: cd Wrapping/Python/MCPServer && uv build
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: Wrapping/Python/MCPServer/dist

  # ---------------------------------------------------------------------------
  # Publish server metadata to the MCP Registry (after PyPI is live)
  # ---------------------------------------------------------------------------
  publish-mcp-registry:
    needs: [release-please, publish-pypi]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # Build every supported native binary using the same reusable workflows that
  # validate pull requests. The called workflows publish their archives as
  # artifacts in this release run.
  build-plugin-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
    with:
      package_version: ${{ needs.release-please.outputs.version }}
      verify_official_runtime: true

  build-plugin-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build-macos.yml
    permissions:
      contents: read
    with:
      package_version: ${{ needs.release-please.outputs.version }}
      verify_official_runtime: true

  build-plugin-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
    with:
      package_version: ${{ needs.release-please.outputs.version }}
      verify_official_runtime: true

  # Keep signing credentials out of pull-request builds. Release builds first
  # produce the same ad-hoc-signed macOS artifacts validated by PRs, then this
  # protected job replaces that signature with Developer ID, packages each
  # plugin as a DMG, and submits it to Apple's notary service.
  sign-plugin-macos:
    needs: [release-please, build-plugin-macos]
    if: ${{ needs.release-please.outputs.release_created }}
    # Individual App Store Connect API keys are issuer-less and require the
    # Xcode 26 notarytool. Older versions incorrectly require --issuer, which
    # is valid only for team API keys.
    runs-on: macos-26
    timeout-minutes: 120
    environment: release-signing
    permissions:
      contents: read
    env:
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Download unsigned macOS build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: plugin-macos-*
          path: unsigned-macos
          merge-multiple: true

      - name: Validate individual App Store Connect API credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/ApiKey_${APPLE_API_KEY_ID}.p8"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          xcrun notarytool --version
          xcrun notarytool history \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --output-format json >/dev/null

      - name: Import Developer ID identity into an ephemeral keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Sign, package, notarize, and staple macOS plugins
        run: |
          WORK_ROOT="$RUNNER_TEMP/notarization"
          OUTPUT_DIR="$PWD/signed-macos"
          LOG_DIR="$PWD/notarization-logs"

          mkdir -p "$WORK_ROOT" "$OUTPUT_DIR" "$LOG_DIR"

          set -- unsigned-macos/*.tar.gz
          test -f "$1"
          expected_archive_count=$#
          archive_count=0
          for archive in "$@"; do
            archive_count=$((archive_count + 1))
            archive_name="$(basename "$archive" .tar.gz)"
            work_dir="$WORK_ROOT/$archive_name"
            mkdir -p "$work_dir"
            tar -xzf "$archive" -C "$work_dir"

            package_dir="$(find "$work_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$package_dir"
            plugin="$package_dir/ParaViewMCP.so"
            test -f "$plugin"

            codesign \
              --force \
              --timestamp \
              --options runtime \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$plugin"
            codesign --verify --strict --verbose=2 "$plugin"

            dmg="$OUTPUT_DIR/$archive_name.dmg"
            hdiutil create \
              -volname "$archive_name" \
              -srcfolder "$work_dir" \
              -format UDZO \
              -ov \
              "$dmg"
            codesign \
              --force \
              --timestamp \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$dmg"
            codesign --verify --strict --verbose=2 "$dmg"

            submission_json="$(xcrun notarytool submit "$dmg" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --wait \
              --timeout 60m \
              --output-format json)"
            printf '%s\n' "$submission_json"
            submission_id="$(printf '%s' "$submission_json" \
              | plutil -extract id raw -o - -)"
            submission_status="$(printf '%s' "$submission_json" \
              | plutil -extract status raw -o - -)"
            xcrun notarytool log \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              "$submission_id" \
              "$LOG_DIR/$archive_name.json"
            test "$submission_status" = "Accepted"

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess \
              --type open \
              --context context:primary-signature \
              --verbose=2 \
              "$dmg"
            (
              cd "$OUTPUT_DIR"
              shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"
            )
          done

          test "$archive_count" -eq "$expected_archive_count"

      - name: Upload signed and notarized macOS artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-macos-notarized
          path: |
            signed-macos/*.dmg
            signed-macos/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload Apple notarization logs
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: plugin-macos-notarization-logs
          path: notarization-logs/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/ApiKey_${APPLE_API_KEY_ID}.p8"

  # ---------------------------------------------------------------------------
  # Upload all platform binaries to the GitHub Release
  # ---------------------------------------------------------------------------
  upload-plugin-binaries:
    needs: [release-please, build-plugin-linux, sign-plugin-macos, build-plugin-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download Linux build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: plugin-linux-*
          merge-multiple: true

      - name: Download Windows build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: plugin-windows-*
          merge-multiple: true

      - name: Download signed and notarized macOS artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: plugin-macos-notarized
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" \
            ./*.tar.gz ./*.zip ./*.dmg ./*.sha256 \
            --repo "${{ github.repository }}"
