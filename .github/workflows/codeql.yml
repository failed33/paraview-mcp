name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  versions:
    uses: ./.github/workflows/paraview-versions.yml

  analyze:
    needs: versions
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
            container: ghcr.io/${{ github.repository }}-ci:${{ needs.versions.outputs.ci_version }}
          - language: python
            build-mode: none
            container: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (C++)
        if: matrix.build-mode == 'manual'
        run: |
          cmake --preset dev -DParaView_DIR=/opt/paraview/lib/cmake/paraview-${{ needs.versions.outputs.ci_series }}
          cmake --build --preset dev

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
