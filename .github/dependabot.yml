version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/Wrapping/Python/MCPServer"
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/.github/docker"
    ignore:
      # Ubuntu 24.04 provides the Python 3.12 ABI used by the CI ParaView SDK.
      - dependency-name: "ubuntu"
        versions: [">24.04"]
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: "monthly"
